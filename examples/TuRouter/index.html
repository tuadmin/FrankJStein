<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Routing - FrankJStein</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --warning-bg: #fffbeb;
            --warning-border: #fcd34d;
            --warning-text: #b45309;
        }
        body { 
            font-family: 'Outfit', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            color: var(--text-main);
            padding: 2.5rem 1.5rem; 
            margin: 0;
            line-height: 1.5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 1.125rem;
            margin-bottom: 2rem;
        }
        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--border);
            border-radius: 16px; 
            padding: 1.75rem; 
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
        }
        .card-server {
            background: var(--warning-bg);
            border: 1px solid var(--warning-border);
        }
        .card h3 {
            margin-top: 0;
            margin-bottom: 0.75rem;
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            background: #e0e7ff;
            color: #4338ca;
        }
        .badge-server {
            background: #fef3c7;
            color: #d97706;
        }
        .nav-group { 
            display: flex; 
            gap: 0.75rem; 
            align-items: center; 
            flex-wrap: wrap; 
            margin-top: 1rem;
        }
        .nav-link { 
            display: inline-flex; 
            align-items: center; 
            padding: 0.625rem 1.25rem; 
            border-radius: 10px; 
            font-weight: 600; 
            font-size: 0.875rem; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            background: #f1f5f9; 
            color: #334155; 
            text-decoration: none;
            border: 1px solid var(--border);
            cursor: pointer;
        }
        .nav-link:hover { 
            background: #e2e8f0; 
            color: #0f172a;
            transform: translateY(-1px); 
        }
        .nav-link-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .nav-link-primary:hover {
            background: var(--primary-hover);
            color: white;
        }
        .nav-link-server { 
            background: white; 
            color: var(--warning-text); 
            border: 1px dashed var(--warning-border); 
        }
        .nav-link-server:hover { 
            background: #fffbeb; 
            color: #78350f;
            transform: translateY(-1px); 
        }
        main { 
            background: var(--card-bg); 
            border: 1px solid var(--border);
            border-radius: 16px; 
            padding: 2rem; 
            min-height: 180px; 
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        }
        main h2 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--primary);
        }
        code {
            font-family: monospace;
            background: #f1f5f9;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
            color: #db2777;
        }
    </style>
</head>
<body>
    <script type="module" src="./app.js"></script>
</body>
</html>
