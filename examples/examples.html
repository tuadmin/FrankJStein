<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&lt;⚡&gt; FrankJStein | Ejemplos del Readme</title>
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #f8fafc;
            --text: #1e293b;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }
        h1 { color: #0f172a; margin-bottom: 2rem; }
        #app {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            min-height: 200px;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .nav-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        button {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover:not(:disabled) {
            background-color: #2563eb;
            transform: translateY(-1px);
        }
        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.7;
        }
        hr { border: 0; border-top: 1px solid #e2e8f0; margin: 2rem 0; }
    </style>
</head>
<body>

    <h1>&lt;⚡&gt; FrankJStein Playground</h1>

    <div id="app">
        <p style="color: #64748b;">Selecciona un ejemplo para visualizar el poder del motor.</p>
    </div>

    <div class="nav-buttons">
        <button id="btn-reactive" onclick="renderExample('reactive')">Ver Reactive Signal</button>
        <button id="btn-suspense" onclick="renderExample('suspense')">Ver Async Suspense</button>
        <button id="btn-suspense-complex" onclick="renderExample('suspense-complex')">Ver Async Suspense Complejo</button>
    </div>

    <script type="module">
        import exampleReactive from "./reactive.js";
        import exampleSuspense from "./suspense.js";
        import exampleSuspenseComplexLazyFunction from "./suspense-complex.js";

        
        const app = document.getElementById("app");
        const btnReactive = document.getElementById("btn-reactive");
        const btnSuspense = document.getElementById("btn-suspense");
        const btnSuspenseComplex = document.getElementById("btn-suspense-complex"); 
        
        window.renderExample = (type) => {
            // Limpiamos el contenedor
            app.innerHTML = "";
            switch(type){
                case 'reactive':
                    app.appendChild(exampleReactive);
                    btnReactive.disabled = true;
                    break;
                case 'suspense':
                    app.appendChild(exampleSuspense);
                    btnSuspense.disabled = true;
                    break;
                case 'suspense-complex':
                    // para que no se cargue al inicio, usamos la función tipo Lazy
                    app.appendChild(
                        exampleSuspenseComplexLazyFunction()
                    );
                    btnSuspenseComplex.disabled = true;
                    break;
            }
            
        }
    </script>
</body>
</html>
